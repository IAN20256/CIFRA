<html lang="es">
<head>
<meta charset="utf-8">

<!--
  CIFRA · chats cifrados sin número de teléfono / encrypted chats without a phone number
  Creado por Ian Amaro.
  Un solo archivo: HTML + CSS + JS (sin frameworks). Servidor: worker.js (Cloudflare).
-->
<style>
:root{
  --bg:#0f1013;--bg2:#14161a;--panel:#1b1e24;--panel2:#23272f;--line:#2b3039;--line2:#373d48;
  --text:#efe9dc;--muted:#a39d91;--faint:#716c63;
  --amber:#ffb547;--amber2:#ffd18a;--ink:#241706;
  --ok:#6fdc9f;--bad:#ff7a6b;
  --cell1:#fbf5e6;--cell2:#e9dfc6;--cell3:#bcae8b;--cellInk:#1d1810;
  --mono:ui-monospace,"SF Mono","Cascadia Mono","Roboto Mono",Menlo,Consolas,monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);
  --wm:none;--wm2:none;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;scrollbar-width:thin;scrollbar-color:var(--line2) transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:15px/1.4 var(--sans)}
body{overflow:hidden;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.mono{font-family:var(--mono)}.muted{color:var(--muted)}.grow{flex:1}
#app{position:fixed;inset:0}
.screen{position:fixed;inset:0;display:none}
.screen.on{display:flex}

/* ── icons ── */
.ic-svg{display:inline-grid;place-items:center;width:22px;height:22px;flex:none}
.ic-svg svg{width:100%;height:100%}
.ic-svg.tiny{width:14px;height:14px}.ic-svg.sm{width:18px;height:18px}.ic-svg.lg{width:30px;height:30px}

/* ── auth screens ── */
.auth{flex-direction:column;overflow-y:auto;background:radial-gradient(120% 70% at 50% -8%,#2c2313 0%,rgba(15,16,19,0) 62%),var(--bg)}
.auth-top{display:flex;align-items:center;gap:8px;padding:calc(10px + var(--st)) 14px 4px;min-height:58px;max-width:520px;width:100%;margin:0 auto}
.auth-top h2{font-size:18px;margin:0}
.auth-body{flex:1;display:flex;flex-direction:column;gap:18px;padding:10px 22px;max-width:460px;width:100%;margin:0 auto}
.auth-body.center{align-items:center;text-align:center;justify-content:center}
.auth-actions{display:flex;flex-direction:column;gap:10px;padding:12px 22px calc(22px + var(--sb));max-width:460px;width:100%;margin:0 auto}
.logo{width:78px;height:78px;filter:drop-shadow(0 12px 30px rgba(255,181,71,.35))}
.logo svg,.brand-sm svg,.empty-logo svg,.chat-empty .lg-logo svg,.shield-in svg{width:100%;height:100%;display:block}
.brand{font-size:44px;font-weight:800;letter-spacing:-.025em;margin:0;line-height:1}
.tag{color:var(--muted);margin:0;font-size:16px;max-width:300px}
.feats{list-style:none;padding:0;margin:4px 0 0;display:flex;flex-direction:column;gap:11px;text-align:left;width:100%;max-width:350px}
.feats li{display:flex;gap:12px;align-items:center;font-size:14.5px}
.feats .fi{width:36px;height:36px;border-radius:11px;background:rgba(255,181,71,.1);color:var(--amber);display:grid;place-items:center;flex:none}
.fine{font-size:12.5px;color:var(--faint);text-align:center;margin:4px 0 0}
.eyebrow{font-size:13px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--amber)}
.lock-ic{width:94px;height:94px;border-radius:30px;background:radial-gradient(circle at 50% 35%,#3a2c12,#1d1a14);display:grid;place-items:center;color:var(--amber);box-shadow:0 18px 50px -18px rgba(255,181,71,.6),inset 0 0 0 1px rgba(255,181,71,.25)}
.lock-ic .ic-svg{width:44px;height:44px}

/* ── rotor (code wheels) ── */
.rotor{display:flex;gap:6px;justify-content:center;align-items:center;position:relative;user-select:none;-webkit-user-select:none}
.rotor .cell{width:42px;height:56px;border-radius:9px;background:linear-gradient(180deg,var(--cell3) 0%,var(--cell2) 18%,var(--cell1) 50%,var(--cell2) 82%,var(--cell3) 100%);color:var(--cellInk);font:800 29px/56px var(--mono);text-align:center;box-shadow:inset 0 0 0 1px rgba(0,0,0,.25),0 3px 0 rgba(0,0,0,.45),0 8px 18px -8px rgba(0,0,0,.6);position:relative;transition:background .15s}
.rotor .cell::after{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:rgba(0,0,0,.07)}
.rotor .gap{width:8px}
.rotor.md .cell{width:32px;height:43px;font-size:22px;line-height:43px;border-radius:7px}
.rotor.sm .cell{width:24px;height:32px;font-size:17px;line-height:32px;border-radius:6px}
.rotor.r8{gap:5px}.rotor.r8 .cell{width:33px;height:46px;font-size:23px;line-height:46px;border-radius:8px}
.rotor.entry{cursor:text}
.rotor.entry input{position:absolute;inset:0;width:100%;height:100%;opacity:0;font-size:16px;border:0;padding:0;margin:0;caret-color:transparent;color:transparent;background:transparent;z-index:2}
.rotor.entry .cell:not(.filled){color:transparent;background:linear-gradient(180deg,#2a2e36,#20242b);box-shadow:inset 0 0 0 1px var(--line2)}
.rotor.entry.focus .cell.cur{box-shadow:inset 0 0 0 2px var(--amber),0 0 0 4px rgba(255,181,71,.14)}
.rotor.entry.focus .cell.cur:not(.filled)::before{content:"";position:absolute;left:50%;top:27%;bottom:27%;width:2px;margin-left:-1px;background:var(--amber);animation:blink 1s steps(1) infinite}
.rotor .cell.roll{animation:roll .08s linear infinite}
.rotor .cell.settle{animation:settle .38s cubic-bezier(.2,1.6,.4,1)}
@keyframes roll{50%{transform:translateY(2px)}}
@keyframes settle{0%{transform:translateY(-7px)}100%{transform:none}}
@keyframes blink{50%{opacity:0}}

/* ── buttons & fields ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 20px;border-radius:14px;font-weight:700;font-size:15.5px;transition:transform .08s,background .15s,opacity .15s;width:100%;text-align:center}
.btn.primary{background:var(--amber);color:var(--ink);box-shadow:0 10px 26px -12px rgba(255,181,71,.7),inset 0 -2px 0 rgba(0,0,0,.18)}
.btn.primary:hover{background:#ffc263}
.btn.ghost{background:var(--panel);border:1px solid var(--line);color:var(--text)}
.btn.ghost:hover{background:var(--panel2)}
.btn.danger{background:rgba(255,122,107,.1);color:#ffb0a6;border:1px solid rgba(255,122,107,.3)}
.btn.sm{min-height:40px;padding:0 13px;font-size:14px;border-radius:11px;width:auto}
.btn:disabled{opacity:.45;pointer-events:none}
.btn:active{transform:translateY(1px)}
.link{color:var(--amber);font-weight:650;padding:10px;font-size:14.5px}
.row-btns{display:flex;gap:8px;width:100%}.row-btns .btn{flex:1}
.field{display:flex;flex-direction:column;gap:7px;text-align:left;width:100%}
.field>label,.lbl{font-size:12px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.07em}
.input{width:100%;height:50px;border-radius:13px;background:var(--bg2);border:1px solid var(--line);padding:0 14px;outline:none;font-size:16px;color:var(--text);transition:border-color .15s,box-shadow .15s}
.input:focus{border-color:var(--amber);box-shadow:0 0 0 3px rgba(255,181,71,.14)}
.input.mono{font-family:var(--mono);letter-spacing:.06em}
.pass-row{display:flex;gap:8px;align-items:center}
.pass-box{position:relative;flex:1;min-width:0}
.pass-box .input{padding-right:48px}
.pass-box .eye{position:absolute;right:4px;top:5px;width:40px;height:40px;border-radius:10px;display:grid;place-items:center;color:var(--muted)}
.meter{display:flex;gap:4px;align-items:center;margin-top:9px;font-size:12.5px;color:var(--muted)}
.meter i{flex:1;height:4px;border-radius:2px;background:var(--line)}
.meter[data-s="1"] i:nth-child(1){background:#ff9f5a}
.meter[data-s="2"] i:nth-child(-n+2){background:var(--amber)}
.meter[data-s="3"] i:nth-child(-n+3){background:var(--ok)}
.meter span{min-width:64px;text-align:right}
.hint{font-size:13.5px;color:var(--muted);margin:0}
.note{display:flex;gap:10px;align-items:flex-start;background:rgba(255,181,71,.07);border:1px solid rgba(255,181,71,.18);color:#f3dcb2;padding:12px 14px;border-radius:14px;font-size:13.5px;text-align:left}
.note .ic-svg{color:var(--amber);margin-top:1px}
.note.danger-note{background:rgba(255,122,107,.08);border-color:rgba(255,122,107,.3);color:#ffc2ba}
.note.danger-note .ic-svg{color:var(--bad)}
.err{color:var(--bad);font-size:14px;min-height:20px;text-align:center}
.warn-box{background:rgba(255,122,107,.08);border:1px solid rgba(255,122,107,.3);color:#ffc2ba;padding:11px 14px;border-radius:14px;font-size:13.5px;text-align:left;width:100%;overflow-wrap:anywhere}
.check{display:flex;gap:10px;align-items:center;font-size:14.5px;cursor:pointer;text-align:left}
.check input{width:22px;height:22px;accent-color:var(--amber);flex:none}
.cred{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
.cred div{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:11px 12px;text-align:left;min-width:0}
.cred small{display:block;color:var(--muted);font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.07em}
.cred b{font:700 21px var(--mono);letter-spacing:.06em;overflow-wrap:anywhere}
.spin{width:18px;height:18px;border:2.5px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite;flex:none;display:inline-block}
.spin.tiny{width:10px;height:10px;border-width:1.5px}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.shake{animation:shake .35s}

/* ── main layout ── */
#v-main{background:var(--bg)}
#list-pane{position:relative;display:flex;flex-direction:column;width:100%;min-width:0;background:var(--bg)}
#chat-pane{display:none;flex:1;min-width:0;flex-direction:column;position:relative;background:var(--bg2)}
#v-main.in-chat #list-pane{display:none}
#v-main.in-chat #chat-pane{display:flex}
@media(min-width:860px){
  #list-pane,#v-main.in-chat #list-pane{display:flex;width:370px;flex:none;border-right:1px solid var(--line)}
  #chat-pane{display:flex}
  .only-mobile{display:none!important}
}
.bar{display:flex;align-items:center;gap:4px;padding:calc(8px + var(--st)) 8px 8px 14px;min-height:62px;border-bottom:1px solid var(--line);background:rgba(15,16,19,.94);position:relative;z-index:4}
.icon-btn{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;color:var(--muted);flex:none;transition:background .15s,color .15s}
.icon-btn:hover{background:var(--panel);color:var(--text)}
.brand-sm{display:flex;align-items:center;gap:9px;font-weight:800;font-size:19px;letter-spacing:-.01em}
.brand-sm .lg{width:30px;height:30px}
.code-chip{display:flex;align-items:center;gap:5px;height:34px;padding:0 10px;border-radius:10px;background:var(--panel);border:1px solid var(--line);font:700 14px var(--mono);letter-spacing:.08em;color:var(--amber2);margin-right:2px}
.net{display:none;background:#2e2412;color:var(--amber2);font-size:13px;text-align:center;padding:6px}
.net.on{display:block}
.list{flex:1;overflow-y:auto;padding:6px 8px calc(100px + var(--sb))}
.item{display:flex;gap:12px;align-items:center;width:100%;padding:10px;border-radius:15px;text-align:left;transition:background .12s}
.item:hover{background:var(--panel)}
.item.sel{background:var(--panel2)}
.av{width:50px;height:50px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:800;font-size:17px;background:hsl(var(--h) 36% 21%);color:hsl(var(--h) 85% 80%);box-shadow:inset 0 0 0 1px hsl(var(--h) 42% 31%)}
.av.grp{border-radius:16px}
.av.sm{width:38px;height:38px;font-size:14px}.av.sm.grp{border-radius:12px}
.av.lg{width:78px;height:78px;font-size:27px}.av.lg.grp{border-radius:24px}
.mid{flex:1;min-width:0}
.nm{display:flex;align-items:center;gap:6px;font-weight:700;font-size:15.5px;min-width:0}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.nm .ic-svg{color:var(--faint)}
.pv{color:var(--muted);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.item.unread .pv{color:var(--text)}
.rt{display:flex;flex-direction:column;align-items:flex-end;gap:6px;font-size:12px;color:var(--faint);flex:none}
.item.unread .rt>span:first-child{color:var(--amber)}
.badge{min-width:21px;height:21px;padding:0 6px;border-radius:11px;background:var(--amber);color:var(--ink);font-size:12px;font-weight:800;display:grid;place-items:center}
.fab{position:absolute;right:18px;bottom:calc(20px + var(--sb));width:60px;height:60px;border-radius:19px;background:var(--amber);color:var(--ink);display:grid;place-items:center;box-shadow:0 14px 34px -10px rgba(255,181,71,.75),inset 0 -3px 0 rgba(0,0,0,.18);z-index:5;transition:transform .1s}
.fab:active{transform:scale(.96)}
.fab .ic-svg{width:28px;height:28px}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;padding:44px 18px 20px;color:var(--muted)}
.empty h3{color:var(--text);margin:0;font-size:18px}
.empty p{margin:0;max-width:300px}
.empty-logo{width:64px;height:64px;opacity:.85}
.empty .row-btns{flex-wrap:wrap;justify-content:center;max-width:360px}
.empty .row-btns .btn{flex:1 1 auto;white-space:nowrap}

/* ── chat ── */
.chat{display:flex;flex-direction:column;flex:1;min-height:0;position:relative}
.chat-empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:var(--muted);text-align:center;padding:24px}
.chat-empty .lg-logo{width:66px;height:66px;opacity:.9}
.chat-id{display:flex;align-items:center;gap:10px;min-width:0;flex:1;text-align:left;padding:4px;border-radius:12px}
.chat-id .ct{display:flex;flex-direction:column;min-width:0}
.chat-id b{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-id small{color:var(--muted);font-size:12.5px;display:flex;align-items:center;gap:5px;white-space:nowrap;overflow:hidden}
.chat-id small .ic-svg{color:var(--ok)}
.chat-id small span:last-child{overflow:hidden;text-overflow:ellipsis}
.flags{display:flex;gap:4px}
.flag{display:flex;align-items:center;gap:4px;height:26px;padding:0 8px;border-radius:8px;background:var(--panel);color:var(--amber2);font-size:12px;font-weight:700;white-space:nowrap}
.msgs-wrap{flex:1;min-height:0;position:relative;display:flex}
.msgs{flex:1;overflow-y:auto;padding:14px 12px 10px;display:flex;flex-direction:column;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;overscroll-behavior:contain}
.wm{position:absolute;inset:0;pointer-events:none;background-image:var(--wm);background-repeat:repeat;z-index:2}
.e2e{align-self:center;display:flex;gap:8px;align-items:flex-start;max-width:340px;background:rgba(255,181,71,.06);border:1px solid rgba(255,181,71,.15);color:#e9d3a8;font-size:12.5px;padding:9px 12px;border-radius:12px;margin:2px 0 8px;text-align:left}
.e2e .ic-svg{color:var(--amber);margin-top:1px}
.older{align-self:center;color:var(--amber);font-size:13px;font-weight:700;padding:8px 12px;border-radius:10px;background:var(--panel);margin:2px 0 6px}
.day{align-self:center;font-size:11.5px;font-weight:800;color:var(--faint);margin:12px 0 4px;text-transform:uppercase;letter-spacing:.09em}
.row{display:flex;margin-top:6px}
.row.cont{margin-top:2px}
.row.mine{justify-content:flex-end}
.bubble{max-width:min(80%,560px);padding:7px 11px 5px;border-radius:17px;background:var(--panel2);position:relative;overflow-wrap:anywhere}
.row.theirs .bubble{border-top-left-radius:6px}
.row.mine .bubble{background:var(--amber);color:var(--ink);border-top-right-radius:6px}
.row.cont.theirs .bubble{border-top-left-radius:17px}
.row.cont.mine .bubble{border-top-right-radius:17px}
.who{font-size:12.5px;font-weight:800;color:hsl(var(--h) 80% 74%);margin-bottom:1px}
.who small{font-family:var(--mono);font-weight:600;opacity:.7}
.txt{white-space:pre-wrap;font-size:15.5px;line-height:1.38}
.meta{display:flex;gap:6px;align-items:center;justify-content:flex-end;font-size:11px;opacity:.62;margin-top:1px;font-variant-numeric:tabular-nums}
.meta .exp{display:flex;align-items:center;gap:3px}
.bubble.del .txt,.dim{opacity:.62;font-style:italic}
.once-line{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14.5px;padding:3px 0;text-align:left}
.once-line .ic-svg{width:20px;height:20px}
.once-line.tap{color:var(--amber2)}
.row.mine .once-line{color:var(--ink)}
.lnk{color:var(--amber2);text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:2px;overflow-wrap:anywhere;cursor:pointer;-webkit-tap-highlight-color:transparent}
.lnk:focus-visible{outline:2px solid var(--amber2);outline-offset:2px;border-radius:3px}
.row.mine .lnk{color:inherit}
.stealth .bubble .txt{filter:blur(7px);transition:filter .12s}
.stealth .bubble.peek .txt{filter:none}
.stealth-tip{align-self:center;display:flex;gap:6px;align-items:center;font-size:12px;color:var(--amber2);margin:0 0 6px}
.msg-actions{display:flex;justify-content:flex-end;gap:6px;margin:5px 0 2px}
.msg-actions button{display:flex;gap:6px;align-items:center;font-size:13px;font-weight:700;color:#ffb0a6;background:rgba(255,122,107,.1);border:1px solid rgba(255,122,107,.25);padding:7px 11px;border-radius:10px}
.msg-actions button.ok{color:var(--amber2);background:rgba(255,181,71,.1);border-color:rgba(255,181,71,.25)}
.sys{align-self:center;font-size:12.5px;color:var(--muted);background:var(--panel);padding:5px 12px;border-radius:10px;margin:8px 0 2px;text-align:center;max-width:90%}
.sys.warn{color:var(--amber2);background:#2e2412}
.pending .bubble{opacity:.72}
.pending.failed .bubble{background:#3a1d19;color:#ffc2ba;opacity:1}
.composer{display:flex;align-items:flex-end;gap:6px;padding:8px 10px calc(8px + var(--sb));border-top:1px solid var(--line);background:var(--bg);position:relative;z-index:4}
.composer textarea{flex:1;resize:none;min-height:46px;max-height:150px;padding:12px 15px;border-radius:23px;background:var(--panel);border:1px solid var(--line);outline:none;font-size:16px;line-height:1.35;color:var(--text);min-width:0}
.composer textarea:focus{border-color:var(--line2)}
.composer.once textarea{border-color:var(--amber);background:#241d12}
.c-btn{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;flex:none;color:var(--muted);transition:background .15s,color .15s}
.c-btn.on{color:var(--amber);background:rgba(255,181,71,.13)}
.c-btn.send{background:var(--amber);color:var(--ink)}

.sheet-wrap{position:fixed;inset:0;z-index:50;display:none}

.sheet-bg{position:absolute;inset:0;background:rgba(4,5,7,.62);animation:fade .2s}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:92dvh;overflow-y:auto;background:var(--bg2);border-top:1px solid var(--line2);border-radius:24px 24px 0 0;padding:8px 18px calc(22px + var(--sb));animation:up .26s cubic-bezier(.2,.9,.25,1);overscroll-behavior:contain}

.grab{width:42px;height:5px;border-radius:3px;background:var(--line2);margin:4px auto 8px}
.sh-head{display:flex;align-items:center;gap:8px;margin:0 0 12px}
.sh-head h2{margin:0;font-size:20px;flex:1}
.sh-sec{margin:18px 0 8px;font-size:12px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.08em}
.stack{display:flex;flex-direction:column;gap:12px}
.stack.center{text-align:center}
.stack.center .secret-row b{text-align:center}
.item .mid,.item .pv,.user-card .mid{display:block}
.menu-item{display:flex;gap:14px;align-items:center;width:100%;padding:14px;border-radius:16px;text-align:left;background:var(--panel);border:1px solid var(--line);margin-bottom:9px}

.menu-item small{color:var(--muted);font-size:13px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:2px 14px}
.set-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}
.set-row:last-child{border-bottom:0}
.set-row .grow b{display:block;font-size:15px;font-weight:650}
.set-row .grow small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.prot{display:flex;align-items:center;gap:10px;padding:8px 0;font-size:14px}

.switch span::after{content:"";position:absolute;top:3px;left:3px;width:23px;height:23px;border-radius:50%;background:#f4efe4;transition:.18s;box-shadow:0 1px 3px rgba(0,0,0,.4)}

.secret-row{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px 8px 8px 14px;width:100%}
.secret-row b{font:700 21px var(--mono);letter-spacing:.12em;flex:1;text-align:left;overflow-wrap:anywhere}
.info-top{display:flex;flex-direction:column;align-items:center;gap:6px;margin:2px 0 4px;text-align:center}
.info-top b{font-size:20px}
.mem{display:flex;align-items:center;gap:10px;padding:8px 0}
.mem small{color:var(--muted);font-family:var(--mono)}

.hold{position:relative;overflow:hidden}
.hold i{position:absolute;left:0;top:0;bottom:0;width:0;background:rgba(255,122,107,.28)}
.hold.go i{width:100%;transition:width 1.2s linear}
.hold>span{position:relative}
.about{font-size:13.5px;color:var(--muted);line-height:1.5;padding-left:18px;margin:0}
.about li{margin:6px 0}
@keyframes up{from{transform:translateY(100%)}}
@keyframes pop{from{opacity:0;transform:translate(-50%,-47%)}}
@keyframes fade{from{opacity:0}}

/* ── view-once viewer, shield, toast ── */
#viewer{position:fixed;inset:0;z-index:70;background:#0a0b0d;display:none;flex-direction:column}

.vbody .wm{background-image:var(--wm2)}

const store = {
  get() { try { return JSON.parse(localStorage.getItem('cifra.v1') || '{}'); } catch { return {}; } },
  set(p) { try { localStorage.setItem('cifra.v1', JSON.stringify(Object.assign(this.get(), p))); } catch { /* private mode */ } },
  wipe() { try { Object.keys(localStorage).filter(k => k.startsWith('cifra.')).forEach(k => localStorage.removeItem(k)); sessionStorage.clear(); } catch { /* */ } },
};
const prefs = Object.assign({ lang: null, sounds: true, previews: true, autolock: 60 }, store.get().prefs || {});
const savePrefs = () => store.set({ prefs });
let LANG = prefs.lang || ((navigator.language || 'es').toLowerCase().startsWith('es') ? 'es' : 'en');
function t(k, v) {
  let s = (T[LANG] && T[LANG][k]) ?? T.es[k] ?? k;
  if (v) for (const [a, b] of Object.entries(v)) s = s.split('{' + a + '}').join(String(b));
  return s;
}
const locale = () => (LANG === 'es' ? 'es-MX' : 'en-US');
function applyI18n() {
  document.documentElement.lang = LANG;
  $$('[data-i]').forEach(el => { el.textContent = t(el.dataset.i); });
  $$('[data-ph]').forEach(el => { el.placeholder = t(el.dataset.ph); });
  $$('[data-al]').forEach(el => { el.setAttribute('aria-label', t(el.dataset.al)); el.title = t(el.dataset.al); });
  $$('.lang-seg button').forEach(b => b.classList.toggle('on', b.dataset.lang === LANG));
}

/* ─── sonidos (Web Audio) ─── */
const SND = {
  ctx: null,
  play(kind) {
    if (!prefs.sounds) return;
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      const ctx = this.ctx || (this.ctx = new AC());
      if (ctx.state === 'suspended') ctx.resume().catch(() => {});
      const t0 = ctx.currentTime;
      const tone = (f, d, type = 'sine', g = 0.05, at = 0, f2 = 0) => {
        const o = ctx.createOscillator(), v = ctx.createGain();
        o.type = type;
        o.frequency.setValueAtTime(f, t0 + at);
        if (f2) o.frequency.exponentialRampToValueAtTime(f2, t0 + at + d);
        v.gain.setValueAtTime(0.0001, t0 + at);
        v.gain.exponentialRampToValueAtTime(g, t0 + at + 0.012);
        v.gain.exponentialRampToValueAtTime(0.0001, t0 + at + d);
        o.connect(v).connect(ctx.destination);
        o.start(t0 + at); o.stop(t0 + at + d + 0.03);
      };
      const fx = {
        send: () => tone(760, 0.09, 'triangle', 0.05, 0, 1150),
        recv: () => { tone(660, 0.09, 'sine', 0.06); tone(990, 0.13, 'sine', 0.05, 0.08); },
        tick: () => tone(1500, 0.025, 'square', 0.012),
        unlock: () => { tone(180, 0.05, 'square', 0.03); tone(260, 0.06, 'square', 0.025, 0.06); tone(520, 0.14, 'triangle', 0.05, 0.12); },
        lock: () => { tone(420, 0.06, 'triangle', 0.04); tone(200, 0.12, 'square', 0.03, 0.06); },
        err: () => tone(150, 0.2, 'sawtooth', 0.035, 0, 110),
        open: () => tone(520, 0.2, 'sine', 0.05, 0, 880),
      };
      if (fx[kind]) fx[kind]();
    } catch { /* audio not available */ }
  },
};

/* ─── cifrado / crypto (WebCrypto) ───
   cuenta:  PBKDF2-SHA256(contraseña, sal, 600k) → HKDF → "auth" (se envía) y llave de cuenta (nunca sale)
   privado: ECDH P-256 entre los dos → HKDF → AES-256-GCM
   grupo:   PBKDF2(código|contraseña) → HKDF → id del grupo (lo único que ve el servidor) y llave AES */
const C = {
  ITER: 600000, GITER: 300000,
  async pbkdf2(pass, salt, iter) {
    const k = await crypto.subtle.importKey('raw', te.encode(pass), 'PBKDF2', false, ['deriveBits']);
    return new Uint8Array(await crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt, iterations: iter }, k, 256));
  },
  async hkdf(ikm, info, bits = 256) {
    const k = await crypto.subtle.importKey('raw', ikm, 'HKDF', false, ['deriveBits']);
    return new Uint8Array(await crypto.subtle.deriveBits({ name: 'HKDF', hash: 'SHA-256', salt: new Uint8Array(32), info: te.encode(info) }, k, bits));
  },
  aes: raw => crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['encrypt', 'decrypt']),
  async seal(key, data, ad) {
    const iv = rnd(12);
    const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv, additionalData: te.encode(ad) }, key, typeof data === 'string' ? te.encode(data) : data);
    return b64(iv) + '.' + b64(ct);
  },
  async open(key, sealed, ad) {
    const i = sealed.indexOf('.');
    return new Uint8Array(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: unb64(sealed.slice(0, i)), additionalData: te.encode(ad) }, key, unb64(sealed.slice(i + 1))));
  },
  async openText(key, sealed, ad) { return td.decode(await this.open(key, sealed, ad)); },
  async account(pass, salt, iter) {
    const m = await this.pbkdf2(pass, unb64(salt), iter);
    const out = { auth: b64(await this.hkdf(m, 'cifra/auth/v1')), acct: await this.aes(await this.hkdf(m, 'cifra/acct/v1')) };
    m.fill(0);
    return out;
  },
  async newKeypair() {
    const kp = await crypto.subtle.generateKey({ name: 'ECDH', namedCurve: 'P-256' }, true, ['deriveBits']);
    return { pub: b64(await crypto.subtle.exportKey('raw', kp.publicKey)), pkcs8: new Uint8Array(await crypto.subtle.exportKey('pkcs8', kp.privateKey)) };
  },
  importPriv: pk => crypto.subtle.importKey('pkcs8', pk, { name: 'ECDH', namedCurve: 'P-256' }, false, ['deriveBits']),
  async dmKey(priv, pub, room) {
    const p = await crypto.subtle.importKey('raw', unb64(pub), { name: 'ECDH', namedCurve: 'P-256' }, false, []);
    const shared = new Uint8Array(await crypto.subtle.deriveBits({ name: 'ECDH', public: p }, priv, 256));
    const k = await this.aes(await this.hkdf(shared, 'cifra/dm/v1|' + room));
    shared.fill(0);
    return k;
  },
  async group(code, pass) { return this.groupFrom(await this.pbkdf2(code + '|' + pass, te.encode('cifra/group/v1'), this.GITER)); },
  async groupFrom(master) {
    return { master, gid: 'g:' + hex(await this.hkdf(master, 'cifra/gid/v1', 128)), key: await this.aes(await this.hkdf(master, 'cifra/gkey/v1')) };
  },
  async fingerprint(a, b, room) {
    const d = new Uint8Array(await crypto.subtle.digest('SHA-256', te.encode([a, b].sort().join('|') + '|' + room)));
    const out = [];
    for (let i = 0; i < 30; i += 5) { let n = 0; for (let j = 0; j < 5; j++) n = n * 256 + d[i + j]; out.push(String(n % 100000).padStart(5, '0')); }
    return out.join(' ');
  },
};
const aad = (room, from, kind) => 'cifra/m|' + room + '|' + from + '|' + kind;
const PASS_CH = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789';
function genPass(n = 4) {
  for (;;) {
    const s = Array.from(crypto.getRandomValues(new Uint32Array(n)), x => PASS_CH[x % PASS_CH.length]).join('');
    if (/\d/.test(s) && /[a-z]/i.test(s)) return s;
  }
}

/* ─── API ─── */
class ApiError extends Error { constructor(code, status, data) { super(code); this.code = code; this.status = status || 0; this.data = data || {}; } }
async function api(method, path, body) {
  if (!SERVER) throw new ApiError('no_server');
  const headers = {};
  if (body) headers['Content-Type'] = 'application/json';
  if (S.token) headers.Authorization = 'Bearer ' + S.token;
  let res;
  try { res = await fetch(SERVER + path, { method, headers, body: body ? JSON.stringify(body) : undefined, cache: 'no-store' }); }
  catch { throw new ApiError('network'); }
  let data = {};
  try { data = await res.json(); } catch { /* not json */ }
  if (!res.ok) {
    const e = new ApiError(data.error || (res.status >= 500 ? 'server_error' : 'network'), res.status, data);
    if (e.code === 'unauthorized' && S.token) sessionEnded();
    throw e;
  }
  return data;
}
const fmtWait = s => { s = +s || 60; return s >= 60 ? Math.ceil(s / 60) + ' min' : s + ' s'; };
function errText(e) {
  const c = e && e.code;
  if (c === 'locked') return t('err_locked', { t: fmtWait(e.data.wait) });
  if (c === 'rate_limited') return t('err_rate', { t: fmtWait(e.data.wait) });
  const map = {
    network: 'err_net', no_server: 'err_no_server', server_misconfigured: 'err_config', no_database: 'err_config',
    bad_login: 'err_bad_login', bad_pass: 'err_bad_pass', no_user: 'no_user', self: 'self_code', bad_group: 'bad_group',
    blocked: 'cant_send', you_blocked: 'you_blocked', full: 'group_full', codes_exhausted: 'err_codes',
    too_large: 'err_too_long', bad_keys: 'err_keys',
  };
  let s = t(map[c] || 'err_server');
  if ((c === 'bad_login' || c === 'bad_pass') && e.data.left != null && e.data.left <= 3) s += ' · ' + t('err_left', { n: e.data.left });
  return s;
}

/* ─── cuenta / account ─── */
async function signupFlow(name, pass) {
  const salt = b64(rnd(16));
  const { auth, acct } = await C.account(pass, salt, C.ITER);
  const kp = await C.newKeypair();
  const priv = await C.seal(acct, kp.pkcs8, 'cifra/priv');
  const r = await api('POST', '/api/signup', { name, salt, iter: C.ITER, auth, pub: kp.pub, priv });
  const privKey = await C.importPriv(kp.pkcs8);
  kp.pkcs8.fill(0);
  return { me: r.me, token: r.token, acct, privKey, priv };
}

async function loginFlow(code, pass) {
  const s = await api('GET', '/api/salt?code=' + encodeURIComponent(code));
  const { auth, acct } = await C.account(pass, s.salt, s.iter);
  const r = await api('POST', '/api/login', { code, auth });
  let pk;
  try { pk = await C.open(acct, r.priv, 'cifra/priv'); } catch { throw new ApiError('bad_keys'); }
  const privKey = await C.importPriv(pk);
  pk.fill(0);
  return { me: r.me, token: r.token, acct, privKey, priv: r.priv };
}

async function startSession(s) {
  Object.assign(S, { me: s.me, token: s.token, acct: s.acct, priv: s.privKey, encPriv: s.priv, rooms: new Map(), blocked: new Set(), rev: 0, current: null, loading: true });
  store.set({ last: { code: s.me.code, name: s.me.name || '' } });
  setWatermark();
  $('#my-code').textContent = '#' + s.me.code;
  closeChat(true);
  show('main');
  renderList();
  try { await loadRooms(true); } catch (e) { if (S.token) toast(errText(e)); }
  S.loading = false;
  if (!S.token) return;
  renderList();
  RT.start();
  SND.play('unlock');
}

// Bloquear: borra llaves y mensajes de la memoria. La próxima vez pide la contraseña.
function lock(msg) {
  if (!S.token) return;
  const tok = S.token;
  try { fetch(SERVER + '/api/logout', { method: 'POST', headers: { Authorization: 'Bearer ' + tok }, keepalive: true }).catch(() => {}); } catch { /* */ }
  wipeSession();
  showLock(msg);
  SND.play('lock');
}
function sessionEnded() {
  if (!S.token) return;
  wipeSession();
  showLock(t('session_closed'));
}
function wipeSession() {
  RT.stop();
  Object.assign(S, { me: null, token: null, acct: null, priv: null, encPriv: null, rooms: new Map(), blocked: new Set(), rev: 0, current: null, once: false, loading: false });
  closeViewer();
  Sheet.close();
  closeChat(true);
  $('#chat-list').replaceChildren();
  $('#composer-input').value = '';
  document.body.classList.remove('shielded');
}

/* ─── salas y mensajes / rooms & messages ─── */
let roomsP = null, roomsAgain = false, roomsT = 0;
function scheduleRooms() { clearTimeout(roomsT); roomsT = setTimeout(() => loadRooms().catch(() => {}), 300); }
function loadRooms(first) {
  if (roomsP) { roomsAgain = true; return roomsP; }
  roomsP = (async () => {
    try { await doLoadRooms(first); } finally { roomsP = null; }
    if (roomsAgain) { roomsAgain = false; await loadRooms(); }
  })();
  return roomsP;
}

async function doLoadRooms(first) {
  if (!S.token) return;
  const token = S.token;
  const r = await api('GET', '/api/rooms');
  if (S.token !== token) return;
  if (first) S.rev = r.rev;
  S.blocked = new Set(r.blocked || []);
  const seen = new Set();
  for (const x of r.rooms) {
    seen.add(x.id);
    let room = S.rooms.get(x.id);
    if (!room) { room = { id: x.id, kind: x.kind, msgs: new Map(), pending: [], loaded: false, more: false, draft: '' }; S.rooms.set(x.id, room); }
    room.ttl = x.ttl; room.stealth = !!x.stealth; room.by = x.by; room.at = x.at;
    if (first || S.current !== x.id) room.unread = x.unread;
    try {
      if (x.kind === 'dm') {
        room.peer = x.peer;
        if (!room.key && x.peer.pub) {
          room.key = await C.dmKey(S.priv, x.peer.pub, x.id);
          room.safety = await C.fingerprint(S.me.pub, x.peer.pub, x.id);
        }
      } else {
        room.members = x.members || [];
        if (!room.key) {
          const sec = JSON.parse(await C.openText(S.acct, x.secret, 'cifra/g|' + x.id));
          const g = await C.groupFrom(unb64(sec.k));
          if (g.gid !== x.id) throw new Error('group id mismatch');
          room.key = g.key; room.sec = sec;
        }
        if (x.meta) room.name = JSON.parse(await C.openText(room.key, x.meta, 'cifra/meta|' + x.id)).name;
      }
      room.bad = !room.key && x.kind === 'group';
    } catch (e) { console.warn('room', x.id, e); room.bad = !room.key; }
    if (x.last && room.key) {
      const m = await decryptRow(room, x.last);
      const prev = room.msgs.get(m.id);
      if (prev) keepLocal(prev, m);
      room.msgs.set(m.id, m);
      if (!room.last || m.id >= room.last.id) room.last = m;
    } else if (!x.last) room.last = null;
    if (S.token !== token) return;
  }
  for (const id of [...S.rooms.keys()]) if (!seen.has(id)) { S.rooms.delete(id); if (S.current === id) closeChat(); }
  renderList();
  if (S.current) { renderChatHeader(); renderMessages(); }
}

const keepLocal = (prev, m) => { if (prev.kind === 'once' && m.kind === 'once' && prev.opened) { m.opened = true; m.raw = ''; } };

async function decryptRow(room, r) {
  const m = { id: r.id, rev: r.rev, from: r.sender, kind: r.kind, at: r.at, exp: r.exp || 0, seen: r.seen || 0, opened: !!r.opened, raw: '' };
  if (r.kind === 'msg') {
    try {
      m.text = JSON.parse(await C.openText(room.key, r.body, aad(room.id, r.sender, 'msg'))).m;
      if (typeof m.text !== 'string') throw new Error('bad');
    } catch { m.bad = true; m.text = ''; }
  } else if (r.kind === 'once') {
    // el texto se descifra solo al abrirlo / decrypted only when opened
    if (r.sender !== (S.me && S.me.code)) { if (r.body && !m.opened) m.raw = r.body; else m.opened = true; }
  } else if (r.kind === 'sys') {
    try { m.sys = JSON.parse(r.body) || {}; } catch { m.sys = {}; }
  }
  return m;
}

async function ingest(rows) {
  const touched = new Set();
  let unknown = false, incoming = false;
  for (const r of rows) {
    const room = S.rooms.get(r.room);
    if (!room || !room.key) { unknown = true; continue; }
    const prev = room.msgs.get(r.id);
    const m = await decryptRow(room, r);
    if (prev) keepLocal(prev, m);
    room.msgs.set(m.id, m);
    if (!room.last || m.id >= room.last.id) room.last = m;
    if (!prev && S.me && m.from !== S.me.code && (m.kind === 'msg' || m.kind === 'once')) {
      if (S.current === room.id && document.visibilityState === 'visible') markRead(room);
      else room.unread = (room.unread || 0) + 1;
      incoming = true;
    }
    touched.add(room.id);
  }
  if (unknown) scheduleRooms();
  if (touched.size) { renderList(); if (touched.has(S.current)) renderMessages(); }
  if (incoming) SND.play('recv');
}

function onEvents(list) {
  const rows = [];
  for (const ev of list) {
    if (ev.type === 'msg' && ev.m) rows.push(ev.m);
    else if (ev.type === 'open') {
      const room = S.rooms.get(ev.room), m = room && room.msgs.get(ev.id);
      if (!m) continue;
      m.seen = ev.seen;
      if (S.me && ev.by === S.me.code) { m.opened = true; m.raw = ''; }
      if (S.current === room.id) renderMessages();
    } else if (ev.type === 'room') scheduleRooms();
  }
  if (rows.length) ingest(rows);
}

const readTimers = new Map();
function markRead(room) {
  room.unread = 0;
  let max = 0;
  for (const id of room.msgs.keys()) if (id > max) max = id;
  if (!max || (room.readSent || 0) >= max) return;
  clearTimeout(readTimers.get(room.id));
  readTimers.set(room.id, setTimeout(() => {
    room.readSent = max;
    if (S.token) api('POST', '/api/read', { room: room.id, id: max }).catch(() => {});
  }, 700));
}

let syncing = null;
function syncNow() {
  if (!S.token) return Promise.resolve();
  if (syncing) return syncing;
  syncing = (async () => {
    const token = S.token;
    try {
      for (let i = 0; i < 10; i++) {
        const r = await api('GET', '/api/sync?since=' + S.rev);
        if (S.token !== token) return;
        if (r.msgs.length) await ingest(r.msgs);
        S.rev = Math.max(S.rev, r.rev);
        if (!r.more) break;
      }
      RT.online(true);
    } catch (e) { if (e.code === 'network') RT.online(false); }
    finally { syncing = null; }
  })();
  return syncing;
}

// Tiempo real: WebSocket con el Worker; si no hay, consulta cada 4 s.  WebSocket, or polling fallback.
const RT = {
  ws: null, tries: 0, t: 0, pollT: 0, slowT: 0, on: false,
  start() {
    this.stop();
    this.on = true;
    this.slowT = setInterval(() => { syncNow(); scheduleRooms(); }, 45000);
    if (S.realtime) this.connect(); else this.poll();
  },
  stop() {
    this.on = false;
    clearTimeout(this.t); clearInterval(this.pollT); clearInterval(this.slowT);
    this.pollT = 0; this.tries = 0;
    if (this.ws) { const w = this.ws; this.ws = null; w.onclose = null; try { w.close(1000); } catch { /* */ } }
    this.online(true);
  },
  connect() {
    if (!this.on || !S.token) return;
    let ws;
    try { ws = new WebSocket(SERVER.replace(/^http/, 'ws') + '/api/ws?t=' + encodeURIComponent(S.token)); }
    catch { this.fail(false); return; }
    this.ws = ws;
    let opened = false, ping = 0;
    ws.onopen = () => {
      opened = true; this.tries = 0; this.unpoll(); this.online(true); syncNow();
      ping = setInterval(() => { try { ws.send('ping'); } catch { /* */ } }, 40000);
    };
    ws.onmessage = e => { if (e.data === 'pong') return; try { onEvents([].concat(JSON.parse(e.data))); } catch { /* */ } };
    ws.onclose = e => {
      clearInterval(ping);
      if (this.ws === ws) this.ws = null;
      if (!this.on) return;
      if (e.code === 4001) { sessionEnded(); return; }
      this.fail(opened);
    };
  },
  fail(wasOpen) {
    this.tries++;
    if (!wasOpen && this.tries >= 3) this.poll();
    else if (!this.pollT) this.online(false);
    clearTimeout(this.t);
    this.t = setTimeout(() => this.connect(), Math.min(30000, 1000 * 2 ** Math.min(this.tries, 5)));
    if (wasOpen) syncNow();
  },
  poll() {
    if (this.pollT) return;
    this.online(true);
    this.pollT = setInterval(() => { if (document.visibilityState === 'visible') syncNow(); }, 4000);
    syncNow();
  },
  unpoll() { clearInterval(this.pollT); this.pollT = 0; },
  online(v) { const n = $('#net'); if (n) n.classList.toggle('on', !v && !!S.token); },
};

/* ─── pantallas / screens ─── */
function show(id) {
  $$('.screen').forEach(s => s.classList.toggle('on', s.id === 'v-' + id));
  if (id === 'welcome') Hero.start(); else Hero.stop();
}
const reduced = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
function rollRotor(cells, digits, dur = 650) {
  cells.forEach((c, i) => {
    clearTimeout(c._t);
    if (reduced()) { c.textContent = digits[i]; return; }
    c.classList.add('roll'); c.classList.remove('settle');
    const end = performance.now() + dur + i * 120;
    const tick = () => {
      if (performance.now() >= end) { c.textContent = digits[i]; c.classList.remove('roll'); void c.offsetWidth; c.classList.add('settle'); return; }
      c.textContent = String(randInt(10));
      c._t = setTimeout(tick, 50);
    };
    tick();
  });
}
const Hero = {
  t: 0,
  start() { if (this.t) return; const run = () => rollRotor($$('#hero-rotor .cell'), String(10000 + randInt(90000))); run(); this.t = setInterval(run, 3800); },
  stop() { clearInterval(this.t); this.t = 0; },
};
function logoEl(cls) { const e = h('span', { class: cls }); e.innerHTML = LOGO; return e; }

/* ─── nombres y avatares ─── */

function roomName(r) {
  if (r.kind === 'group') return r.name || t('group');
  return (r.peer && r.peer.name) || '#' + ((r.peer && r.peer.code) || dmPeerCode(r.id));
}
function nameOf(room, code) {
  if (S.me && code === S.me.code) return t('you');
  if (room.kind === 'dm') return (room.peer && room.peer.name) || '#' + code;
  const m = (room.members || []).find(x => x.code === code);

}
const memberCount = r => ((r.members || []).length === 1 ? t('member1') : t('members', { n: (r.members || []).length }));

  if (w.length) return ([...w[0]][0] + (w[1] ? [...w[1]][0] : '')).toUpperCase();
  return String(code || '').slice(-2);
}

}

/* ─── lista de chats / chat list ─── */
function renderList() {
  const list = $('#chat-list');
  if (!S.me) { list.replaceChildren(); return; }
  if (S.loading && !S.rooms.size) { list.replaceChildren(h('div', { class: 'center-row' }, h('span', { class: 'spin' }))); return; }
  const rooms = [...S.rooms.values()]
    // un chat privado vacío que otra persona abrió aparece hasta que llegue su primer mensaje
    .filter(r => !(r.kind === 'dm' && !r.last && r.by !== S.me.code && r.id !== S.current))
    .sort((a, b) => ((b.last && b.last.at) || b.at) - ((a.last && a.last.at) || a.at));
  if (!rooms.length) { list.replaceChildren(emptyState()); return; }
  list.replaceChildren(...rooms.map(roomItem));
}
function roomItem(r) {
  return h('button', { class: 'item' + (r.id === S.current ? ' sel' : '') + (r.unread ? ' unread' : ''), onclick: () => openChat(r.id) },
    avatar(r),
    h('span', { class: 'mid' },
      h('span', { class: 'nm' }, h('span', { class: 'ell', text: roomName(r) }), r.ttl ? icon('clock', 'tiny') : null, r.stealth ? icon('eyeOff', 'tiny') : null),
      h('span', { class: 'pv', text: preview(r) })),
    h('span', { class: 'rt' }, h('span', { text: r.last ? listTime(r.last.at) : '' }), r.unread ? h('span', { class: 'badge', text: r.unread > 99 ? '99+' : String(r.unread) }) : null));
}
function preview(r) {
  if (r.bad) return '⚠️ ' + t('cant_decrypt');
  const m = r.last;
  if (!m) return r.kind === 'group' ? memberCount(r) : t('new_chat_pv');
  if (m.kind === 'sys') return sysText(r, m);
  const who = m.from === S.me.code ? t('you') + ': ' : (r.kind === 'group' ? nameOf(r, m.from) + ': ' : '');
  if (m.kind === 'del') return who + t('deleted_msg');
  if (m.kind === 'once') return who + '👁 ' + t('once_sent');
  if (!prefs.previews) return who + '🔒 ' + t('encrypted_msg');
  if (m.bad) return who + '⚠️ ' + t('cant_decrypt');
  return who + m.text.replace(/\s+/g, ' ');
}
function emptyState() {
  const txt = t('my_code_text', { code: S.me.code });
  return h('div', { class: 'empty' }, logoEl('empty-logo'), h('h3', { text: t('empty_t') }), h('p', { text: t('empty_d') }),
    rotorDisplay(S.me.code, 'md'),

/* ─── fechas / time ─── */
const fmtTime = ts => new Date(ts).toLocaleTimeString(locale(), { hour: 'numeric', minute: '2-digit' });

}

async function loadHistory(room, initial) {

  try {
    let before = 0;
    if (!initial) for (const id of room.msgs.keys()) if (!before || id < before) before = id;
    const r = await api('GET', '/api/messages?room=' + encodeURIComponent(room.id) + (before ? '&before=' + before : ''));
    for (const row of r.msgs) {
      const m = await decryptRow(room, row);
      const prev = room.msgs.get(m.id);
      if (prev) keepLocal(prev, m);
      room.msgs.set(m.id, m);
      if (!room.last || m.id >= room.last.id) room.last = m;
    }
    room.more = r.more;

  } catch (e) { if (S.token) toast(errText(e)); }
  finally { room.loading = false; }

// Mensajes temporales: desaparecen de la pantalla al vencer (el servidor también los borra).
function tickExpiry() {
  if (!S.token) return;
  const now = Date.now();
  let cur = false, list = false;
  for (const room of S.rooms.values()) {
    let removed = false;
    for (const [id, m] of room.msgs) if (m.exp && m.exp <= now) { room.msgs.delete(id); removed = true; }
    if (room.last && room.last.exp && room.last.exp <= now) {
      room.last = null;
      for (const m of room.msgs.values()) if (!room.last || m.id > room.last.id) room.last = m;
      list = true;
    }
    if (room.id === S.current && (removed || [...room.msgs.values()].some(m => m.exp))) cur = true;
  }
  if (list) renderList();
  if (cur) renderMessages();
}

/* ─── enlaces / links ─── */
// Se detectan en el texto ya descifrado; nunca se usa innerHTML ni se visita el enlace.
// Detected in the decrypted text; never innerHTML, and nothing fetches the link (no previews).
const LINK_TLDS = 'com|net|org|io|dev|app|mx|es|co|ar|cl|pe|uy|ve|ec|bo|py|gt|cr|do|us|uk|ca|de|fr|it|pt|br|eu|info|me|tv|gg|ly|ai|edu|gov|xyz|site|online|store|shop|blog|link|page|tech|cloud|so|to|fm|news|live|art|fun|top';
const LINK_RE = new RegExp('(?:https?://[^\\s<>"]+|www\\.[^\\s<>"]+|(?:[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?\\.)+(?:' + LINK_TLDS + ')(?![a-z0-9-])(?:[/?#][^\\s<>"]*)?)', 'gi');
function trimLink(s) {
  for (;;) {
    const before = s;
    s = s.replace(/[.,;:!?¡¿'"…*_~]+$/, '');
    for (const [o, c] of [['(', ')'], ['[', ']'], ['{', '}']]) {
      if (s.endsWith(c) && s.split(o).length < s.split(c).length) s = s.slice(0, -1);
    }
    if (s === before) return s;
  }
}
function safeLink(raw) {

    return u;
  } catch { return null; }
}
function linkify(text) {
  const out = [];
  let last = 0;
  for (const mt of String(text).matchAll(LINK_RE)) {
    const i = mt.index;
    if (i < last || (i > 0 && /[\w@.\-/:]/.test(text[i - 1]))) continue;   // correos, partes de otra palabra / emails, parts of words
    const raw = trimLink(mt[0]);
    const url = safeLink(raw);
    if (!url) continue;
    if (i > last) out.push(text.slice(last, i));
    const a = h('span', { class: 'lnk', role: 'link', tabindex: '0', text: raw });
    const go = e => { e.preventDefault(); e.stopPropagation(); confirmLink(url); };
    a.addEventListener('click', go);
    a.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') go(e); });
    out.push(a);
    last = i + raw.length;
  }
  if (last < text.length) out.push(text.slice(last));
  return out;
}

  const host = url.hostname;   // las letras raras salen como xn--… / lookalike letters show as xn--…
  const warn = [];
  if (url.protocol === 'http:') warn.push(t('link_http'));
  if (/(^|\.)xn--/i.test(host)) warn.push(t('link_idn'));
  if (url.username || url.password) warn.push(t('link_user'));
  if (/^[\d.]+$/.test(host) || host.startsWith('[')) warn.push(t('link_ip'));
  const go = h('button', { class: 'btn primary', type: 'button' }, t('link_open'));
  go.onclick = () => { Sheet.close(); window.open(url.href, '_blank', 'noopener,noreferrer'); };
  Sheet.open(h('div', { class: 'stack' }, sheetHead(t('link_title')),
    h('div', { class: 'link-host' }, icon('globe'), h('b', { text: host })),
    h('p', { class: 'link-full mono', text: url.href }),
    warn.map(w => h('p', { class: 'link-warn' }, icon('alert', 'sm'), h('span', { text: w }))),
    h('p', { class: 'hint', text: t('link_hint') }),
    h('div', { class: 'row-btns' }, h('button', { class: 'btn ghost', type: 'button', onclick: () => Sheet.close() }, t('cancel')), go)));
  if ($('#viewer').classList.contains('on')) $('#sheet').classList.add('top');
}

function rotorInput(len) {

const Sheet = {
  onClose: null,
  open(content, onClose) {
    const prev = this.onClose;
    this.onClose = null;
    if (prev) try { prev(); } catch { /* */ }
    $('#sheet-body').replaceChildren(content);
    $('#sheet').classList.remove('top');
    $('#sheet').classList.add('on');
    $('#sheet .sheet').scrollTop = 0;
    this.onClose = onClose || null;
    Nav.sync();
  },
  close() {
    const w = $('#sheet');
    if (!w.classList.contains('on')) return;
    w.classList.remove('on', 'top');
    $('#sheet-body').replaceChildren();
    const f = this.onClose;
    this.onClose = null;
    if (f) try { f(); } catch { /* */ }
    Nav.sync();
  },
  isOpen() { return $('#sheet').classList.contains('on'); },
  onTop() { return this.isOpen() && $('#sheet').classList.contains('top'); },
};
const sheetHead = title => h('div', { class: 'sh-head' }, h('h2', { text: title }), h('button', { class: 'icon-btn', type: 'button', 'aria-label': t('close'), onclick: () => Sheet.close() }, icon('x')));

// Botón "atrás" de Android: cierra hoja → visor → chat.  Android back closes sheet → viewer → chat.
const Nav = {
  has: false, skip: false, t: 0, off: false,
  sync() { clearTimeout(this.t); if (!this.off) this.t = setTimeout(() => this.apply(), 0); },
  apply() {
    if (this.off) return;
    const open = Sheet.isOpen() || $('#viewer').classList.contains('on') || (isMobile() && !!S.current);
    if (open && !this.has) { history.pushState({ cifra: 1 }, ''); this.has = true; }
    else if (!open && this.has) { this.has = false; this.skip = true; history.back(); }
  },
};
addEventListener('popstate', () => {
  if (Nav.skip) { Nav.skip = false; return; }
  Nav.has = false;
  if (Sheet.onTop()) Sheet.close();
  else if ($('#viewer').classList.contains('on')) closeViewer();
  else if (Sheet.isOpen()) Sheet.close();
  else if (S.current && isMobile()) closeChat();
  Nav.apply();
});

// Cambiar contraseña = volver a cifrar tu llave privada y las llaves de tus grupos con la nueva.
async function changePassword(oldPw, newPw) {
  const s = await api('GET', '/api/salt?code=' + S.me.code);
  const old = await C.account(oldPw, s.salt, s.iter);
  const salt = b64(rnd(16));
  const nu = await C.account(newPw, salt, C.ITER);
  const pk = await C.open(S.acct, S.encPriv, 'cifra/priv');
  const priv = await C.seal(nu.acct, pk, 'cifra/priv');
  pk.fill(0);
  await loadRooms();
  const secrets = [];
  for (const r of S.rooms.values()) {
    if (r.kind !== 'group') continue;
    if (!r.sec) throw new ApiError('bad_keys');
    secrets.push({ room: r.id, secret: await C.seal(nu.acct, JSON.stringify(r.sec), 'cifra/g|' + r.id) });
  }
  await api('POST', '/api/password', { old: old.auth, salt, iter: C.ITER, auth: nu.auth, priv, secrets });
  S.acct = nu.acct;
  S.encPriv = priv;
}

  if (tok) try { fetch(SERVER + '/api/logout', { method: 'POST', headers: { Authorization: 'Bearer ' + tok }, keepalive: true }).catch(() => {}); } catch { /* */ }
  wipeSession();
  store.set({ last: null });
  show('welcome');
}

/* ─── pantallas de acceso / auth screens ─── */
let suPass = null, liCode = null, liPass = null, lkPass = null;
function goSignup() {
  suPass = passField(genPass(), { gen: true, meter: true, ac: 'new-password' });
  $('#su-pass').replaceChildren(suPass.el);
  $('#su-name').value = '';
  show('signup');
}
async function doSignup() {
  const btn = $('#su-go');
  if (btn.disabled) return;
  const name = $('#su-name').value.trim().slice(0, 32), pass = suPass.value;
  if (pass.length < 4) { toast(t('err_pass4')); shake(suPass.input); return; }
  busy(btn, true, t('making_keys'));
  try {
    pendingSession = await signupFlow(name, pass);
    store.set({ last: { code: pendingSession.me.code, name: pendingSession.me.name || '' } });
    showCreated(pendingSession.me.code, pass);
  } catch (e) { toast(errText(e)); SND.play('err'); }
  finally { busy(btn, false); }
}
function showCreated(code, pass) {
  const r = $('#cr-rotor');
  r.replaceChildren(...[...code].map(() => h('span', { class: 'cell' }, '0')));
  $('#cr-code').textContent = code;
  $('#cr-pass').textContent = pass;
  $('#cr-ok').checked = false;
  $('#cr-go').disabled = true;
  $('#cr-copy').onclick = () => copy(t('creds_text', { code, pass }));
  show('created');
  rollRotor($$('.cell', r), code, 900);
  SND.play('unlock');
}
async function enterCreated() {
  const s = pendingSession;
  pendingSession = null;
  $('#cr-pass').textContent = '';
  if (!s) { showLock(); return; }
  await startSession(s);
}
function goLogin() {
  liCode = rotorInput(5);
  liPass = passField('', { masked: true, ac: 'current-password' });
  $('#li-code').replaceChildren(liCode.el);
  $('#li-pass').replaceChildren(liPass.el);
  $('#li-err').textContent = '';
  liCode.onchange = v => { if (v.length === 5) liPass.input.focus(); };
  liPass.input.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
  show('login');
  setTimeout(() => liCode.focus(), 120);
}
async function doLogin() {
  const btn = $('#li-go'), err = $('#li-err');
  if (btn.disabled) return;
  const code = liCode.value, pass = liPass.value;
  if (code.length !== 5) { err.textContent = t('err_code5'); shake(liCode.el); return; }
  if (pass.length < 4) { err.textContent = t('err_pass4'); return; }
  busy(btn, true, t('unlocking'));
  err.textContent = '';
  try { await startSession(await loginFlow(code, pass)); }
  catch (e) { err.textContent = errText(e); SND.play('err'); }
  finally { busy(btn, false); }
}
function showLock(msg) {
  const last = store.get().last;
  if (!last || !last.code) { show('welcome'); return; }
  $('#lk-hello').textContent = last.name ? t('hello', { n: last.name }) : '';
  $('#lk-rotor').replaceChildren(rotorDisplay(last.code, 'md'));
  lkPass = passField('', { masked: true, ac: 'current-password' });
  $('#lk-pass').replaceChildren(lkPass.el);
  lkPass.input.addEventListener('keydown', e => { if (e.key === 'Enter') doUnlock(); });
  $('#lk-err').textContent = msg || '';
  show('lock');
  if (!isTouch()) setTimeout(() => lkPass.input.focus(), 120);
}
async function doUnlock() {
  const btn = $('#lk-go'), err = $('#lk-err');
  if (btn.disabled) return;
  const last = store.get().last || {}, pass = lkPass.value;
  if (pass.length < 4) { err.textContent = t('err_pass4'); return; }
  busy(btn, true, t('unlocking'));
  err.textContent = '';
  try { await startSession(await loginFlow(last.code, pass)); }
  catch (e) { err.textContent = errText(e); shake($('#v-lock .lock-ic')); SND.play('err'); }
  finally { busy(btn, false); }
}

/* ─── anti-filtraciones / anti-leak ─── */
// Marca de agua con TU código y la hora: si alguien hace captura, se sabe quién fue.
function setWatermark() {
  if (!S.me) return;
  const d = new Date();
  const label = S.me.code + ' · ' + d.toLocaleDateString(locale(), { day: '2-digit', month: '2-digit' }) + ' ' + fmtTime(d.getTime());
  const mk = a => 'url("data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="250" height="150"><text x="125" y="80" text-anchor="middle" transform="rotate(-24 125 75)" font-family="monospace" font-size="14" font-weight="700" fill="rgb(150,150,150)" fill-opacity="' + a + '">' + xml(label) + '</text></svg>') + '")';
  document.documentElement.style.setProperty('--wm', mk(0.11));
  document.documentElement.style.setProperty('--wm2', mk(0.18));
}
function shield(on) { document.body.classList.toggle('shielded', !!on && !!S.token); }
let hiddenAt = 0, shotAt = 0;
function onVisibility() {
  if (document.visibilityState === 'hidden') {
    hiddenAt = Date.now();
    shield(true);
    closeViewer();
    if (S.token && prefs.autolock === 0) lock();
  } else {
    if (S.token && hiddenAt && prefs.autolock > 0 && Date.now() - hiddenAt >= prefs.autolock * 1000) lock();
    hiddenAt = 0;
    setTimeout(() => { if (document.visibilityState === 'visible' && document.hasFocus()) shield(false); }, 150);
    if (S.token) { syncNow(); const r = S.rooms.get(S.current); if (r) markRead(r); }
  }
}
function screenshotTaken() {
  shield(true);
  setTimeout(() => shield(!document.hasFocus()), 1500);
  const now = Date.now();
  if (S.current && now - shotAt > 3000) { shotAt = now; api('POST', '/api/alert', { room: S.current }).catch(() => {}); }
}
function protect() {
  const guarded = n => { const el = n && (n.nodeType === 1 ? n : n.parentElement); return !!(el && el.closest && el.closest('.msgs, #viewer')); };
  const block = e => { if (guarded(e.target)) e.preventDefault(); };
  ['contextmenu', 'selectstart', 'dragstart'].forEach(ev => document.addEventListener(ev, block));
  ['copy', 'cut'].forEach(ev => document.addEventListener(ev, e => {
    const s = getSelection();
    if (guarded(e.target) || (s && s.anchorNode && guarded(s.anchorNode))) e.preventDefault();
  }));
  document.addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && (e.key === 'p' || e.key === 'P') && S.token) e.preventDefault();
    if (e.key === 'Escape') {
      if (Sheet.onTop()) Sheet.close();
      else if ($('#viewer').classList.contains('on')) closeViewer();
      else if (Sheet.isOpen()) Sheet.close();
      else if (S.current && isMobile()) closeChat();
    }
  });
  document.addEventListener('keyup', e => { if (e.key === 'PrintScreen' && S.token) screenshotTaken(); });
  document.addEventListener('visibilitychange', onVisibility);
  addEventListener('blur', () => shield(true));
  addEventListener('focus', () => { if (document.visibilityState === 'visible') shield(false); });
  addEventListener('pagehide', () => shield(true));
}
// Botón de pánico: borra todo lo local y sale a una página neutral.
function panic() {
  Nav.off = true; // a pending history.back() must not cancel the exit
  clearTimeout(Nav.t);
  const tok = S.token;
  if (tok) try { fetch(SERVER + '/api/logout', { method: 'POST', headers: { Authorization: 'Bearer ' + tok }, keepalive: true }).catch(() => {}); } catch { /* */ }
  try { wipeSession(); } catch { /* */ }
  store.wipe();
  $('#app').replaceChildren();
  location.replace('https://www.google.com/');
}

/* ─── arranque / boot ─── */
function setLang(l) {
  LANG = l;
  prefs.lang = l;
  savePrefs();
  applyI18n();
  setOnce(S.once);
  const last = store.get().last;
  $('#lk-hello').textContent = last && last.name ? t('hello', { n: last.name }) : '';
  if (S.token) { setWatermark(); renderList(); if (S.current) { renderChatHeader(); renderMessages(); } }
}
function makeManifest() {
  try {
    const iconSvg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><rect width="512" height="512" rx="110" fill="#0f1013"/><g transform="translate(64 70) scale(6)">' + LOGO_PATHS + '</g></svg>';
    const base = location.href.split('#')[0].split('?')[0];
    const m = {
      name: 'Cifra', short_name: 'Cifra', description: t('tagline'), start_url: base, scope: new URL('./', base).href,
      display: 'standalone', background_color: '#0f1013', theme_color: '#0f1013',
      icons: [{ src: 'data:image/svg+xml,' + encodeURIComponent(iconSvg), sizes: 'any', type: 'image/svg+xml', purpose: 'any' }],
    };
    document.head.append(h('link', { rel: 'manifest', href: 'data:application/manifest+json,' + encodeURIComponent(JSON.stringify(m)) }));
  } catch { /* */ }
}
function bindUI() {
  $$('[data-logo]').forEach(el => { el.innerHTML = LOGO; });
  $$('[data-icon]').forEach(el => el.replaceChildren(icon(el.dataset.icon, el.dataset.size)));
  $$('.lang-seg button').forEach(b => b.addEventListener('click', () => setLang(b.dataset.lang)));
  $$('[data-back]').forEach(b => b.addEventListener('click', () => show('welcome')));
  $('#go-signup').onclick = goSignup;
  $('#go-login').onclick = goLogin;
  $('#su-go').onclick = doSignup;
  $('#su-name').addEventListener('keydown', e => { if (e.key === 'Enter' && suPass) suPass.input.focus(); });
  $('#cr-ok').onchange = e => { $('#cr-go').disabled = !e.target.checked; };
  $('#cr-go').onclick = enterCreated;
  $('#li-go').onclick = doLogin;
  $('#li-new').onclick = goSignup;
  $('#lk-go').onclick = doUnlock;
  $('#lk-other').onclick = () => { store.set({ last: null }); show('welcome'); };
  $('#my-code').onclick = () => { if (S.me) share(t('my_code_text', { code: S.me.code })); };
  $('#btn-lock').onclick = () => lock();
  $('#btn-settings').onclick = () => sheetSettings();
  $('#fab').onclick = () => sheetNew();
  $('#chat-back').onclick = () => closeChat();
  $('#chat-id').onclick = $('#chat-info').onclick = () => { const r = S.rooms.get(S.current); if (r) sheetInfo(r); };
  $('#once-btn').onclick = () => { setOnce(!S.once); if (S.once) toast(t('once_on_toast')); };
  $('#send-btn').addEventListener('mousedown', e => e.preventDefault()); // keep the keyboard open
  $('#send-btn').onclick = sendMessage;
  const ta = $('#composer-input');
  ta.addEventListener('input', () => autoGrow(ta));
  ta.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing && !isTouch()) { e.preventDefault(); sendMessage(); } });
  $('#sheet .sheet-bg').onclick = () => Sheet.close();
  $('#viewer-close').onclick = closeViewer;
  $('#shield').addEventListener('pointerdown', () => { if (document.visibilityState === 'visible') shield(false); });
}
async function checkServer() {
  const w = $('#srv-warn');
  try { const r = await api('GET', '/api/health'); S.realtime = !!r.realtime; w.hidden = true; }
  catch (e) { w.hidden = false; w.textContent = '⚠️ ' + errText(e) + (SERVER ? ' (' + SERVER + ')' : ''); }
}
function boot() {
  if (!window.crypto || !crypto.subtle) {
    document.body.textContent = t('err_crypto');
    document.body.style.cssText = 'padding:30px;font:16px system-ui;color:#eee;background:#0f1013';
    return;
  }
  bindUI();
  applyI18n();
  protect();
  if (/^https?:$/.test(location.protocol)) makeManifest();
  setInterval(tickExpiry, 15000);
  setInterval(() => { if (S.token) setWatermark(); }, 60000);
  const last = store.get().last;
  if (last && last.code) showLock(); else show('welcome');
  checkServer();
}
boot();
</script>
