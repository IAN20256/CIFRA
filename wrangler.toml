name = "cifra"
main = "worker.js"
compatibility_date = "2025-09-01"

# index.html se empaqueta dentro del Worker: el mismo Worker sirve la app y la API.
# Si cambias index.html, vuelve a correr "npx wrangler deploy".
# index.html is bundled into the Worker, which serves both the app and the API.
[[rules]]
type = "Text"
globs = ["**/*.html"]
fallthrough = true

[[d1_databases]]
binding = "DB"
database_name = "cifra-db"
database_id = "PEGA-AQUI-EL-ID-DE-TU-D1"   # npx wrangler d1 create cifra-db

# Tiempo real (WebSockets). Funciona en el plan gratis.
# Real-time (WebSockets). Works on the free plan.
[[durable_objects.bindings]]
name = "HUB"
class_name = "Hub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Hub"]

# Limpieza: mensajes temporales vencidos, sesiones viejas, grupos vacíos.
[triggers]
crons = ["*/15 * * * *"]
